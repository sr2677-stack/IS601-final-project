<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Calculator{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #f7f8fc;
      --text: #171923;
      --muted: #5f6b7a;
      --card: #ffffff;
      --line: #e8ebf2;
      --brand: #0f7bff;
      --brand-dark: #0a63cf;
      --accent: #00bfa5;
      --shadow: 0 14px 34px rgba(20, 31, 56, 0.08);
    }
    body {
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      margin: 0;
      background:
        radial-gradient(1200px 450px at 10% -10%, rgba(15, 123, 255, 0.1), transparent 50%),
        radial-gradient(1000px 500px at 95% -15%, rgba(0, 191, 165, 0.09), transparent 50%),
        var(--bg);
      color: var(--text);
    }
    nav {
      background: #111420;
      color: #fff;
      padding: 0.8rem 1.5rem;
      display: flex;
      gap: 1.25rem;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    nav strong { letter-spacing: 0.1px; }
    nav a {
      color: #c9d0df;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0.35rem 0.55rem;
      border-radius: 7px;
      transition: background .2s, color .2s;
    }
    nav a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    .logout-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: linear-gradient(135deg, #ff6b4a, #ff3c6f);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      padding: 0.42rem 0.88rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s, filter .2s;
      box-shadow: 0 8px 18px rgba(255, 60, 111, 0.35);
    }
    .logout-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .logout-btn:active { transform: translateY(0); }
    .container { max-width: 1040px; margin: 2rem auto; padding: 0 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.4rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 1.1rem;
      background: linear-gradient(135deg, var(--brand), #3498ff);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform .15s, box-shadow .2s, background .2s;
      box-shadow: 0 10px 20px rgba(15, 123, 255, 0.26);
    }
    .btn:hover { transform: translateY(-1px); background: linear-gradient(135deg, var(--brand-dark), var(--brand)); }
    .btn:active { transform: translateY(0); }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.72rem 0.65rem; text-align: left; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
    th { font-weight: 700; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: .04em; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
    .stat-box { background: #f4f8ff; border-radius: 10px; padding: 1rem; text-align: center; border: 1px solid #deebff; }
    .stat-box .value { font-size: 1.7rem; font-weight: 800; color: var(--brand); }
    .stat-box .label { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }
    @media (max-width: 760px) {
      nav { gap: 0.6rem; padding: 0.75rem 0.9rem; flex-wrap: wrap; }
      nav a { font-size: 0.85rem; padding: 0.3rem 0.42rem; }
      .logout-btn { font-size: 0.8rem; padding: 0.36rem 0.72rem; }
      .container { margin: 1.15rem auto; padding: 0 0.7rem; }
      .card { border-radius: 14px; }
      th, td { padding: 0.62rem 0.45rem; font-size: 0.86rem; }
    }
  </style>
</head>
<body>
  {% if user is defined %}
  <nav>
    <strong>🧮 Calculator</strong>
    <a href="/dashboard">Dashboard</a>
    <a href="/history">History</a>
    <a href="/report">Report</a>
    <form method="post" action="/logout" style="margin-left:auto">
      <button type="submit" class="logout-btn">Sign out - {{ user.username }}</button>
    </form>
  </nav>
  {% endif %}
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
