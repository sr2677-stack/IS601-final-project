{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:400px;margin:4rem auto">
  <div class="card">
    <h2 style="margin-top:0;text-align:center">Welcome back</h2>
    <p style="text-align:center;color:#71717a;font-size:.9rem;margin-top:0">Sign in to your account</p>

    {% if error %}
    <div style="background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:.75rem 1rem;border-radius:6px;font-size:.875rem;margin-bottom:1rem">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" novalidate>
      <div style="margin-bottom:1rem">
        <label for="username" style="display:block;font-size:.875rem;font-weight:500;margin-bottom:.375rem">
          Username or email
        </label>
        <input
          id="username"
          name="username"
          type="text"
          required
          autocomplete="username"
          placeholder="username or email"
          style="width:100%;padding:.6rem .75rem;border:1px solid #e4e4e7;border-radius:6px;font-size:.9rem;outline:none;transition:border-color .15s"
          onfocus="this.style.borderColor='#6366f1'"
          onblur="this.style.borderColor='#e4e4e7'"
        >
      </div>

      <div style="margin-bottom:1.5rem">
        <label for="password" style="display:block;font-size:.875rem;font-weight:500;margin-bottom:.375rem">
          Password
        </label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
          style="width:100%;padding:.6rem .75rem;border:1px solid #e4e4e7;border-radius:6px;font-size:.9rem;outline:none;transition:border-color .15s"
          onfocus="this.style.borderColor='#6366f1'"
          onblur="this.style.borderColor='#e4e4e7'"
        >
      </div>

      <button
        type="submit"
        class="btn"
        style="width:100%;padding:.65rem;font-size:.95rem;justify-content:center"
      >
        Sign in
      </button>
    </form>

    <p style="text-align:center;font-size:.875rem;color:#71717a;margin-bottom:0;margin-top:1.25rem">
      Don't have an account?
      <a href="/register" style="color:#6366f1;text-decoration:none;font-weight:500">Register</a>
    </p>
  </div>
</div>
{% endblock %}
